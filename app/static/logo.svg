    <rect x="36" y="6" width="28" height="18" rx="6" fill="#fff" opacity="0.06"/>
    <circle cx="50" cy="48" r="18" fill="#fff" opacity="0.06"/>
    <rect x="46" y="2" width="8" height="8" rx="2" fill="#7a4419"/>
  </g>

  <!-- subtle floral accent -->
  <path d="M18 88 C26 76, 42 76, 50 88" fill="none" stroke="#c49a6c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M74 70 C80 62, 94 62, 100 70" fill="none" stroke="#c49a6c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

