<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Scent | Inventory Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; --surface: #111112; --accent: #c4a27a; 
            --text-main: #ffffff; --text-dim: #8b8b93; 
            --border: rgba(255, 255, 255, 0.06); --glass: rgba(255, 255, 255, 0.03);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }
        
        .main-container { width: 100%; max-width: 1100px; padding: 60px 20px; }

        /* Unique Header Section */
        .vault-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .vault-header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; }
        .back-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* Unique Stats Bar */
        .quick-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .metric-tile { background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; }
        .metric-tile span { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .metric-tile h3 { font-size: 1.4rem; color: var(--accent); margin-top: 5px; }

        /* The Glass Form */
        .glass-card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 28px; 
            padding: 35px; margin-bottom: 50px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; }
        
        input, textarea { 
            background: #000; border: 1px solid var(--border); color: white; 
            padding: 12px 15px; border-radius: 10px; font-size: 0.9rem; 
        }
        input:focus { border-color: var(--accent); outline: none; }

        /* Search & Table */
        .search-bar { width: 100%; padding: 15px; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; color: white; margin-bottom: 20px; }
        
        .table-wrap { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 18px; text-align: left; color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; background: rgba(255,255,255,0.01); }
        td { padding: 18px; border-top: 1px solid var(--border); font-size: 0.9rem; }

        /* Buttons */
        .btn-deploy { 
            background: var(--accent); color: #000; border: none; padding: 15px; 
            border-radius: 12px; cursor: pointer; font-weight: 800; width: 100%; transition: 0.3s;
        }
        .btn-deploy:hover { transform: scale(1.01); filter: brightness(1.1); }
        .btn-del { color: #ff4757; background: none; border: none; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="vault-header">
            <div>
                <a href="/admin-dashboard" class="back-link">← Return to Dashboard</a>
                <h1>Scent Vault</h1>
            </div>
            <div style="text-align: right;">
                <p style="color: var(--text-dim); font-size: 0.8rem;">Authorized Access Only</p>
                <p style="font-weight: 800; color: var(--accent);">V.2.0.6</p>
            </div>
        </header>

        <section class="glass-card">
            <form action="/admin/add-product" method="POST" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="input-box">
                        <label>Scent Name</label>
                        <input type="text" name="name" placeholder="E.g. Golden Amber" required>
                    </div>
                    <div class="input-box">
                        <label>Price (Rs.)</label>
                        <input type="number" name="price" placeholder="900" required>
                    </div>
                    <div class="input-box">
                        <label>Initial Stock</label>
                        <input type="number" name="stock" placeholder="5 or 10" required>
                    </div>
                </div>
                <div class="input-box" style="margin-bottom: 20px;">
                    <label>Profile Description</label>
                    <input type="text" name="description" placeholder="Describe the notes and feel..." required>
                </div>
                <div class="input-box" style="margin-bottom: 25px;">
                    <label>Upload Imagery</label>
                    <input type="file" name="perf_image" accept="image/*" capture="environment" required style="border: 1px dashed var(--accent);">
                </div>
                <button type="submit" class="btn-deploy">Deploy to Marketplace</button>
            </form>
        </section>

        <input type="text" id="vaultSearch" class="search-bar" placeholder="Filter scents by name..." onkeyup="filterTable()">
        
        <div class="table-wrap">
            <table id="vaultTable">
                <thead>
                    <tr>
                        <th>Scent Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th style="text-align: right;">Management</th>
                    </tr>
                </thead>
                <tbody>
                    {% for prod in products %}
                    <tr>
                        <td><strong>{{ prod[1] }}</strong></td>
                        <td>Rs. {{ prod[2] }}</td>
                        <td><span style="color: var(--accent);">{{ prod[5] }} units</span></td>
                        <td style="text-align: right;">
                            <form action="/admin/delete-product/{{ prod[0] }}" method="POST">
                                <button type="submit" class="btn-del">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function filterTable() {
            let input = document.getElementById("vaultSearch");
            let filter = input.value.toUpperCase();
            let table = document.getElementById("vaultTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[0];
                if (td) {
                    let txtValue = td.textContent || td.innerText;
                    tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }
    </script>
</body>
</html>
