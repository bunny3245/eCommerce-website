<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Perfumania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 450px;
            width: 90%;
            margin: 2rem auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 2rem 1.5rem 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: #666;
            font-size: 0.85rem;
        }

        .form-container {
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: #fafafa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            background: white;
        }

        .btn-auth {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .switch-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }

        .switch-text a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>PERFUMANIA</h1>
                <p>Admin Portal</p>
            </div>

            <div class="form-container" id="loginForm">
                <form action="/admin/login" method="POST">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="username" required placeholder="admin@perfumania.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-auth">Sign In</button>
                </form>
                <p class="switch-text">
                    New admin? <a href="#" onclick="showRegister(); return false;">Create Account</a>
                </p>
            </div>

            <div class="form-container" id="registerForm">
                <form action="/admin/register" method="POST">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" name="full_name" required placeholder="Usama Khan">
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required placeholder="admin@perfumania.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-auth">Create Account</button>
                </form>
                <p class="switch-text">
                    Already have access? <a href="#" onclick="showLogin(); return false;">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        function showLogin() {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        }

        function showRegister() {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }

        // Check hash on load
        if (window.location.hash === '#register') {
            showRegister();
        } else {
            showLogin();
        }

        // Handle hash changes
        window.addEventListener('hashchange', () => {
            if (window.location.hash === '#register') {
                showRegister();
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
