<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Perfumenia Store{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- Custom CSS - FIXED -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="/">Perfumania</a>
            <a href="/cart" class="cart-btn">
                <i class="bi bi-bag"></i>
                <span class="cart-badge">{{ cart_count if cart_count else 0 }}</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Perfumenia — Modern Fragrances for Every Moment</p>
            <p class="small">© 2024 Perfumenia. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
